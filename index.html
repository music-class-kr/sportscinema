<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>스포츠 시네마 수업 자료</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Noto Serif KR',serif;
  background: linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}
.wrap{
  width:100%;
  max-width:780px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:40px;
}
.main-title{
  color:#f0e6d3;
  font-family:'Nanum Myeongjo',serif;
  font-size:44pt;
  font-weight:800;
  letter-spacing:7px;
  text-align:center;
  text-shadow:0 2px 12px rgba(0,0,0,0.5);
  margin-bottom:-6px;
}
.main-sub{
  color:#c9a96e;
  font-size:14pt;
  letter-spacing:4px;
  text-align:center;
  margin-bottom:6px;
}

.movie{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}
.movie-title{
  display:flex;
  align-items:baseline;
  gap:12px;
  width:100%;
}
.movie-title .emoji{font-size:22pt;}
.movie-title .name{
  font-family:'Nanum Myeongjo',serif;
  font-size:22pt;
  font-weight:800;
  color:#f0e6d3;
  letter-spacing:2px;
}
.movie-title .en{
  font-size:11pt;
  color:#c9a96e;
  letter-spacing:2px;
}
.movie-title::after{
  content:'';
  flex:1;
  height:1px;
  background:rgba(255,255,255,0.18);
  align-self:center;
}

/* PPT 버튼 */
.btn-ppt{
  width:100%;
  background: linear-gradient(135deg,#c9a96e,#e8c97e,#c9a96e);
  border:none;
  border-radius:18px;
  padding:32px 24px;
  cursor:pointer;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:18px;
  box-shadow:0 8px 32px rgba(201,169,110,0.35);
  transition:transform 0.2s, box-shadow 0.2s;
}
.btn-ppt:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 36px rgba(201,169,110,0.55);
}
.btn-ppt .icon{font-size:38pt;flex-shrink:0;}
.btn-ppt .text{display:flex;flex-direction:column;gap:2px;}
.btn-ppt .label{
  font-family:'Nanum Myeongjo',serif;
  font-size:20pt;
  font-weight:800;
  color:#1a1a2e;
  letter-spacing:2px;
}
.btn-ppt .desc{
  font-size:11.5pt;
  color:#3a3a2e;
  letter-spacing:0.5px;
}

/* 아래 작은 버튼들 */
.small-row{
  width:100%;
  display:grid;
  gap:14px;
}
.small-row.cols2{grid-template-columns:1fr 1fr;}
.small-row.cols3{grid-template-columns:1fr 1fr 1fr;}
.btn-small{
  background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,255,255,0.25);
  border-radius:14px;
  padding:24px 10px;
  cursor:pointer;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  transition:transform 0.2s, background 0.2s;
}
.btn-small:hover{
  transform:translateY(-3px);
  background:rgba(255,255,255,0.15);
}
.btn-small .icon{font-size:30pt;}
.btn-small .label{
  font-family:'Nanum Myeongjo',serif;
  font-size:15pt;
  font-weight:700;
  color:#f0e6d3;
  letter-spacing:1px;
  text-align:center;
}
.btn-small .desc{
  font-size:10pt;
  color:#aaa;
  letter-spacing:0.3px;
  text-align:center;
}
</style>
</head>
<body>
<div class="wrap">

  <div>
    <div class="main-title">스포츠 시네마</div>
    <div class="main-sub">SPORTS CINEMA · 수업 자료</div>
  </div>

  <!-- ══════ 1947 보스톤 ══════ -->
  <div class="movie">
    <div class="movie-title">
      <span class="emoji">🏃</span>
      <span class="name">1947 보스톤</span>
      <span class="en">ROAD TO BOSTON</span>
    </div>
    <a href="영화 1947 보스톤 PPT.html" class="btn-ppt">
      <span class="icon">📊</span>
      <span class="text">
        <span class="label">수업 PPT</span>
        <span class="desc">클릭하면 바로 열립니다</span>
      </span>
    </a>
    <div class="small-row cols2">
      <a href="영화 1947 보스톤 활동지.html" class="btn-small">
        <span class="icon">📋</span>
        <span class="label">활동지</span>
        <span class="desc">학생용 활동지</span>
      </a>
      <a href="영화 1947 보스톤 활동지 답지.html" class="btn-small">
        <span class="icon">🔴</span>
        <span class="label">활동지 답지</span>
        <span class="desc">교사용 답안</span>
      </a>
    </div>
  </div>

  <!-- ══════ 드림 ══════ -->
  <div class="movie">
    <div class="movie-title">
      <span class="emoji">⚽</span>
      <span class="name">드림</span>
      <span class="en">DREAM</span>
    </div>
    <a href="영화 드림 PPT (영화 리바운드와 비교).html" class="btn-ppt">
      <span class="icon">📊</span>
      <span class="text">
        <span class="label">수업 PPT</span>
        <span class="desc">클릭하면 바로 열립니다</span>
      </span>
    </a>
    <div class="small-row cols2">
      <a href="영화 드림 활동지.html" class="btn-small">
        <span class="icon">📋</span>
        <span class="label">활동지</span>
        <span class="desc">학생용 활동지</span>
      </a>
      <a href="영화 드림 활동지 정답 PPT.html" class="btn-small">
        <span class="icon">🔴</span>
        <span class="label">활동지 정답</span>
        <span class="desc">교사용 답안 PPT</span>
      </a>
    </div>
  </div>

  <!-- ══════ 리바운드 ══════ -->
  <div class="movie">
    <div class="movie-title">
      <span class="emoji">🏀</span>
      <span class="name">리바운드</span>
      <span class="en">REBOUND</span>
    </div>
    <a href="영화 리바운드 최종 ppt.html" class="btn-ppt">
      <span class="icon">📊</span>
      <span class="text">
        <span class="label">수업 PPT</span>
        <span class="desc">클릭하면 바로 열립니다</span>
      </span>
    </a>
    <div class="small-row cols3">
      <a href="영화 리바운드 활동지 최종.html" class="btn-small">
        <span class="icon">📋</span>
        <span class="label">활동지</span>
        <span class="desc">학생용 활동지</span>
      </a>
      <a href="영화 리바운드 활동지 답지 최종.html" class="btn-small">
        <span class="icon">🔴</span>
        <span class="label">활동지 답지</span>
        <span class="desc">교사용 답안</span>
      </a>
      <a href="영화 리바운드 퀴즈 25문제.html" class="btn-small">
        <span class="icon">✅</span>
        <span class="label">퀴즈</span>
        <span class="desc">25문제</span>
      </a>
    </div>
  </div>

</div>
</body>
</html>
